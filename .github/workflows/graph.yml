name: Generate Activity Graph

on:
  schedule:
    - cron: "0 0 * * *" # Runs automatically every 24 hours
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: samcore07
          template: classic
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 5
          filename: assets/activity.svg
